name: Build & Deploy

on:
  push:
    branches: [master]

env:
  IMAGE: europe-west1-docker.pkg.dev/evs-datastack-prod/data-pipelines/elt-mssql-sage
  CLOUD_RUN_JOB: elt-mssql-sage
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & Push
        run: |
          docker build -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:latest

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update ${{ env.CLOUD_RUN_JOB }} \
            --image ${{ env.IMAGE }}:latest \
            --region ${{ env.REGION }}
